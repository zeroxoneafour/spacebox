# Buildings and building upgrades.
#
# Inputs and outputs are daily at full employment and scale linearly with workers/max_workers.
# Upkeep is daily and does not scale with workers. Buildings with the "barren" class can be
# built on barren planets; they must have max_workers = 0 (they run themselves).
#
# Extra fields beyond the design document:
#   amenities      - amenities provided (scales with workers for staffed buildings)
#   build_cost     - paid from empire storage when construction starts
#   build_days     - construction time
#   requires_tech  - technologies the owner must know
#   buildable      - false for scenario-only buildings
#   max_per_planet - limit per planet
#   hp             - bombardment damage absorbed before destruction (default: ruleset)
#
# Buildings that output an on-demand resource (shipbuilding) only staff and run while their
# owner has ships queued.
#
# Terrain classes: "land" buildings need a tile without water and "water" buildings need a
# water tile; buildings with neither may stand on either. Natural "blocker"s are generated
# with the planet (a third of habitable worlds, nearly all of barren ones) and are never
# built; clearing one costs its `remove_cost`.
#
# Adjacency bonuses apply once per adjacent matching building (they stack). Use
# `building = "..."` (a building, or a class if no building has that name) or
# `building_class = "..."`.

[import]
resources = "resources.toml"
jobs = "jobs.toml"
technologies = "technologies.toml"

# =============================================================================================
# Administration and housing
# =============================================================================================

[building.capital-complex]
display_name = "Capital Complex"
description = "Seat of planetary government. Self-sufficient enough to bootstrap a colony."
