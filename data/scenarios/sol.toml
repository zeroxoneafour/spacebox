# Scenario: humanity's first steps beyond Sol, with a rival next door at Tau Ceti.
#
#   spacebox run data/scenarios/sol.toml --days 720 --out data/saves/sol-720.toml
#
# Remove an empire's `[empire.x.ai]` table to stop the built-in governor from running it.
# The two empires start at peace; declare war (e.g. from the web client) to see fleets fight.

[import]
resources = "../resources.toml"
buildings = "../buildings.toml"
technologies = "../technologies.toml"
ships = "../ships.toml"
rules = "../rules.toml"
orbital = "../mods/orbital-agriculture.toml"

[game]
day = 0
seed = 2201
ruleset = "rules.default"

# =============================================================================================
# Empires
# =============================================================================================

[empire.empire-1]
display_name = "Terran Federation"
color = "#4e79a7"
capital = "sol"
resource_stores = [
    { resource = "resources.alloy", count = 500 },
    { resource = "resources.minerals", count = 2000 },
    { resource = "resources.food", count = 1500 },
    { resource = "resources.energy", count = 1500 },
    { resource = "resources.consumer-goods", count = 600 },
    { resource = "resources.influence", count = 300 },
]
technologies = ["technologies.hydroponics"]

[empire.empire-1.ai]
militant = 0.6
expansionist = 0.7
scientific = 0.6

[empire.empire-1.fleets.home-fleet]
display_name = "Sol Defence Force"
system = "sol"
coordinates = { x = 27, y = 8 }
ships = [
    { ship = "ships.fighter", hull = 500, shield = 350 },
    { ship = "ships.fighter" },
    { ship = "ships.corvette" },
    { ship = "ships.corvette" },
]

[empire.empire-2]
display_name = "Cetian Concord"
color = "#e15759"
capital = "tau-ceti"
accepts_migrants = false
resource_stores = [
    { resource = "resources.alloy", count = 300 },
    { resource = "resources.minerals", count = 1500 },
    { resource = "resources.food", count = 800 },
    { resource = "resources.energy", count = 2500 },
    { resource = "resources.consumer-goods", count = 400 },
    { resource = "resources.rare-crystals", count = 200 },
    { resource = "resources.influence", count = 300 },
]
technologies = ["technologies.improved-mining"]

[empire.empire-2.ai]
militant = 0.8
expansionist = 0.4
scientific = 0.3

[empire.empire-2.fleets.vanguard]
display_name = "Cetian Vanguard"
system = "tau-ceti"
coordinates = { x = 24, y = 12 }
ships = [
    { ship = "ships.corvette" },
    { ship = "ships.corvette" },
    { ship = "ships.corvette" },
]

# =============================================================================================
# Sol
# =============================================================================================

[system.sol]
display_name = "Sol"
star_type = "yellow-small"
star_count = 1
owned_by = "empire-1"
linked_systems = ["alpha-centauri", "sirius"]
coordinates = { x = 0, y = 0 }

[system.sol.planets.sol-1]
display_name = "Venus"
coordinates = { x = -14, y = 12 }
size = "large"
habitable = false
[system.sol.planets.sol-1.tiles.0]
resource_multipliers = [{ resource = "resources.exotic-gases", mult = 1.4 }]

[system.sol.planets.sol-3]
display_name = "Earth"
coordinates = { x = 25, y = 4 }
total_pop = 800

# Tile 0 is the north pole; tiles 1-5 surround it (see `spacebox tiles large`).
[system.sol.planets.sol-3.tiles.0]
resource_multipliers = [
    { resource = "resources.alloy", mult = 1.1 },
    { resource = "resources.food", mult = 0.75 }
]

[system.sol.planets.sol-3.tiles.0.building]
type = "buildings.alloy-forge"
upgrades = [ "buildings.faster-forge" ]
workers = 100

[system.sol.planets.sol-3.tiles.1]
building = "buildings.housing"

[system.sol.planets.sol-3.tiles.2]
building = "buildings.mine"           # adjacent to the forge: cheaper inputs

[system.sol.planets.sol-3.tiles.3]
building = "buildings.capital-complex"

[system.sol.planets.sol-3.tiles.4]
