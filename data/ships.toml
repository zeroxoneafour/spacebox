# Ship designs, weapons and outfits.
#
# A ship's build cost is its own `build_cost` plus those of its weapons and outfits. Resources
# marked `on_demand` (shipbuilding) are supplied over time by the owner's shipyards; the rest
# is paid when the ship is ordered.
#
# Units: distances are system units (planets sit within ~100 of their star), speeds are units
# per day, `fire_rate` is days between shots, `shield_regen` is shield points per day.
#
# Outfits add flat bonuses (hull, shield, shield_regen) and multipliers (hull_mult,
# shield_mult, shield_regen_mult, speed_mult, hyperjump_mult, damage_mult, range_mult,
# fire_rate_mult). fire_rate_mult divides the delay between shots, so 1.25 fires 25% more often.
# Additive bonuses are summed before multipliers are applied.

[import]
resources = "resources.toml"
technologies = "technologies.toml"

# =============================================================================================
# Weapons
# =============================================================================================

[ship-weapon.laser]
display_name = "Laser"
build_cost = [
    { resource = "resources.alloy", count = 10 }
]
shield_damage = 20
hull_damage = 50
# can fire once every 0.5 days. fire rate mult divides rather than adding
fire_rate = 0.5
range = 10

[ship-weapon.mass-driver]
display_name = "Mass Driver"
description = "Kinetic slugs. Weak against shields, brutal against hulls."
build_cost = [
    { resource = "resources.alloy", count = 15 }
]
shield_damage = 10
hull_damage = 80
fire_rate = 1.0
range = 8

[ship-weapon.missile-launcher]
display_name = "Missile Launcher"
build_cost = [
    { resource = "resources.alloy", count = 25 }
]
shield_damage = 40
hull_damage = 120
fire_rate = 2.0
range = 20

[ship-weapon.plasma-cannon]
display_name = "Plasma Cannon"
build_cost = [
    { resource = "resources.alloy", count = 40 },
    { resource = "resources.volatile-motes", count = 5 },
]
shield_damage = 60
hull_damage = 200
fire_rate = 1.5
range = 12

[ship-weapon.point-defense]
display_name = "Point Defense"
build_cost = [
    { resource = "resources.alloy", count = 10 }
]
shield_damage = 15
hull_damage = 15
fire_rate = 0.25
range = 5

# =============================================================================================
# Outfits
# =============================================================================================

[ship-outfit.shield-booster]
display_name = "Shield Booster"
build_cost = [
    { resource = "resources.alloy", count = 25 }
]
shield = 50
shield_regen_mult = 1.5

[ship-outfit.afterburner]
display_name = "Afterburner"
build_cost = [
    { resource = "resources.alloy", count = 15 }
]
speed_mult = 1.3

[ship-outfit.armor-plating]
display_name = "Armor Plating"
build_cost = [
    { resource = "resources.alloy", count = 40 }
]
hull = 300
speed_mult = 0.95

[ship-outfit.deflector-array]
display_name = "Deflector Array"
build_cost = [
    { resource = "resources.alloy", count = 50 },
    { resource = "resources.exotic-gases", count = 5 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 1 }
]
shield_regen = 5
shield_mult = 1.4

[ship-outfit.hyperdrive-tuner]
display_name = "Hyperdrive Tuner"
build_cost = [
    { resource = "resources.alloy", count = 30 },
    { resource = "resources.exotic-gases", count = 5 },
]
hyperjump_mult = 0.6

[ship-outfit.targeting-computer]
display_name = "Targeting Computer"
build_cost = [
    { resource = "resources.alloy", count = 30 },
    { resource = "resources.rare-crystals", count = 5 },
]
fire_rate_mult = 1.25
range_mult = 1.1

# =============================================================================================
# Ships
# =============================================================================================

[ship.scout]
display_name = "Scout"
description = "Unarmed and fast; good for keeping an eye on the neighbours."
build_cost = [
    { resource = "resources.alloy", count = 20 },
    { resource = "resources.shipbuilding", count = 40 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 0.5 }
]
hull = 150
base_speed = 18
outfits = [ "afterburner" ]

[ship.corvette]
display_name = "Corvette"
build_cost = [
    { resource = "resources.alloy", count = 40 },
    { resource = "resources.shipbuilding", count = 80 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 1 }
]
hull = 400
shield = 200
base_speed = 12
shield_regen = 8
weapons = [ "laser" ]
outfits = [ "afterburner" ]

[ship.fighter]
display_name = "Fighter"
build_cost = [
    { resource = "resources.alloy", count = 50 }, # shipbuilding sites only turn labor into shipbuilding as the resource cost is accounted for here
    { resource = "resources.shipbuilding", count = 100 } # this is a special resource generated by shipbuilding buildings on-demand
]
upkeep_cost = [
    { resource = "resources.energy", count = 1 }
]
hull = 500
shield = 350
# system internal units per day
base_speed = 10
shield_regen = 10
weapons = [ "laser", "laser" ]
outfits = [ "shield-booster", "afterburner" ]

[ship.destroyer]
display_name = "Destroyer"
requires_tech = ["technologies.naval-doctrine"]
build_cost = [
    { resource = "resources.alloy", count = 120 },
    { resource = "resources.shipbuilding", count = 250 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 2 }
]
hull = 1200
shield = 600
base_speed = 9
shield_regen = 15
weapons = [ "mass-driver", "mass-driver", "laser" ]
outfits = [ "armor-plating" ]

[ship.frigate]
display_name = "Plasma Frigate"
requires_tech = ["technologies.plasma-weapons", "technologies.deflector-shields"]
build_cost = [
    { resource = "resources.alloy", count = 150 },
    { resource = "resources.shipbuilding", count = 300 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 2 }
]
hull = 1000
shield = 900
base_speed = 10
shield_regen = 20
weapons = [ "plasma-cannon", "point-defense" ]
outfits = [ "deflector-array" ]

[ship.cruiser]
display_name = "Cruiser"
requires_tech = ["technologies.capital-ships"]
build_cost = [
    { resource = "resources.alloy", count = 300 },
    { resource = "resources.shipbuilding", count = 600 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 4 }
]
hull = 3000
shield = 1500
base_speed = 7
shield_regen = 30
weapons = [ "mass-driver", "mass-driver", "missile-launcher", "missile-launcher" ]
outfits = [ "armor-plating", "shield-booster", "targeting-computer" ]

[ship.battleship]
display_name = "Battleship"
requires_tech = ["technologies.titanic-hulls"]
build_cost = [
    { resource = "resources.alloy", count = 800 },
    { resource = "resources.shipbuilding", count = 1500 },
]
upkeep_cost = [
    { resource = "resources.energy", count = 8 },
    { resource = "resources.volatile-motes", count = 0.1 },
]
hull = 8000
shield = 4000
base_speed = 5
shield_regen = 60
hyperjump_mult = 1.5
weapons = [ "plasma-cannon", "plasma-cannon", "plasma-cannon", "missile-launcher", "missile-launcher", "point-defense" ]
outfits = [ "armor-plating", "armor-plating", "deflector-array", "targeting-computer", "hyperdrive-tuner" ]
