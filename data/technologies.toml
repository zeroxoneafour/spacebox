# Technologies. Research costs are paid from `research-resources`: transient ones (research)
# from daily output while the technology is being researched, normal ones from the stockpile.
#
# Effects: [technology.x.pop] growth-mult; [technology.x.ships] fleet-size-add and ship stat
# multipliers; [technology.x.buildings] building modifiers as
# { value, buildings = [...], building-tags = [...] } (omit both to affect every building).

[import]
resources = "resources.toml"
buildings = "buildings.toml"

[technology.hydroponics]
display-name = "Hydroponics"
description = "Soil-free agriculture under artificial light."
research-resources = [ { resource = "resources.research", count = 400 } ]
research-tags = ["society"]

[technology.improved-mining]
display-name = "Improved Mining Techniques"
research-resources = [ { resource = "resources.research", count = 450 } ]
research-tags = ["engineering"]

[technology.grid-optimization]
display-name = "Grid Optimization"
research-resources = [ { resource = "resources.research", count = 500 } ]
research-tags = ["physics"]

[technology.grid-optimization.buildings]
output-mult = { value = 1.1, building-tags = ["buildings.power"] }

[technology.holographic-entertainment]
display-name = "Holographic Entertainment"
research-resources = [ { resource = "resources.research", count = 600 } ]
research-tags = ["society"]

[technology.administrative-ai]
display-name = "Administrative AI"
research-resources = [ { resource = "resources.research", count = 700 } ]
research-tags = ["physics"]

[technology.administrative-ai.buildings]
upkeep-cost-mult = { value = 0.8, building-tags = ["buildings.administration"] }
output-mult = { value = 1.2, building-tags = ["buildings.administration"] }

[technology.automated-mining]
display-name = "Automated Mining"
research-resources = [ { resource = "resources.research", count = 800 } ]
research-tags = ["engineering"]
prerequisites = ["improved-mining"]

[technology.gene-tailored-crops]
display-name = "Gene-Tailored Crops"
research-resources = [ { resource = "resources.research", count = 900 } ]
research-tags = ["society"]
prerequisites = ["hydroponics"]

[technology.gene-tailored-crops.buildings]
output-mult = { value = 1.15, building-tags = ["buildings.agriculture"] }

[technology.material-synthesis]
display-name = "Material Synthesis"
research-resources = [ { resource = "resources.research", count = 1000 } ]
research-tags = ["engineering"]
prerequisites = ["improved-mining"]

[technology.xeno-geology]
display-name = "Xeno-Geology"
description = "Locating and extracting strategic deposits on lifeless worlds."
research-resources = [ { resource = "resources.research", count = 1000 } ]
research-tags = ["engineering"]
prerequisites = ["automated-mining"]

[technology.social-engineering]
display-name = "Social Engineering"
research-resources = [ { resource = "resources.research", count = 1100 } ]
research-tags = ["society"]
prerequisites = ["holographic-entertainment"]

[technology.social-engineering.buildings]
output-mult = { value = 1.25, building-tags = ["buildings.amenities"] }

[technology.advanced-alloys]
display-name = "Advanced Alloys"
research-resources = [ { resource = "resources.research", count = 1400 } ]
research-tags = ["engineering"]
prerequisites = ["material-synthesis"]

[technology.advanced-alloys.buildings]
output-mult = { value = 1.1, building-tags = ["buildings.forge"] }

[technology.nano-fabrication]
display-name = "Nano-Fabrication"
research-resources = [ { resource = "resources.research", count = 1500 } ]
research-tags = ["engineering"]
prerequisites = ["material-synthesis"]

[technology.quantum-computing]
display-name = "Quantum Computing"
research-resources = [ { resource = "resources.research", count = 1600 } ]
research-tags = ["physics"]
prerequisites = ["grid-optimization"]

[technology.quantum-computing.buildings]
output-mult = { value = 1.1, building-tags = ["buildings.research"] }

[technology.gene-therapy]
display-name = "Gene Therapy"
research-resources = [ { resource = "resources.research", count = 1500 } ]
research-tags = ["society"]
prerequisites = ["gene-tailored-crops"]

[technology.gene-therapy.pop]
growth-mult = 1.25

[technology.fusion-power]
display-name = "Fusion Power"
research-resources = [ { resource = "resources.research", count = 1800 } ]
research-tags = ["physics"]
prerequisites = ["grid-optimization", "xeno-geology"]

[technology.atmospheric-engineering]
display-name = "Atmospheric Engineering"
description = "Makes it possible to terraform large barren worlds."
research-resources = [ { resource = "resources.research", count = 2500 } ]
research-tags = ["society"]
prerequisites = ["gene-tailored-crops", "xeno-geology"]

[technology.arcology-project]
display-name = "Arcology Project"
research-resources = [ { resource = "resources.research", count = 3000 } ]
research-tags = ["engineering"]
prerequisites = ["nano-fabrication", "social-engineering"]

[technology.naval-doctrine]
display-name = "Naval Doctrine"
description = "Fleet tactics that make destroyer-class warships practical."
research-resources = [ { resource = "resources.research", count = 600 } ]
research-tags = ["military"]

[technology.naval-doctrine.ships]
fleet-size-add = 5

[technology.deflector-shields]
display-name = "Deflector Shields"
research-resources = [ { resource = "resources.research", count = 900 } ]
research-tags = ["military"]
prerequisites = ["naval-doctrine", "grid-optimization"]

[technology.plasma-weapons]
display-name = "Plasma Weapons"
research-resources = [ { resource = "resources.research", count = 1400 } ]
research-tags = ["military"]
prerequisites = ["deflector-shields", "material-synthesis"]

[technology.plasma-weapons.ships]
fire-rate-mult = 1.1

[technology.capital-ships]
display-name = "Capital Ships"
description = "Cruiser hulls with the keel strength to carry heavy weapons."
research-resources = [ { resource = "resources.research", count = 1800 } ]
research-tags = ["military"]
prerequisites = ["naval-doctrine", "advanced-alloys"]

[technology.capital-ships.ships]
fleet-size-add = 5

[technology.orbital-drydocks]
display-name = "Orbital Drydocks"
research-resources = [ { resource = "resources.research", count = 1200 } ]
research-tags = ["military"]
prerequisites = ["naval-doctrine", "automated-mining"]

[technology.titanic-hulls]
display-name = "Titanic Hulls"
research-resources = [ { resource = "resources.research", count = 4000 } ]
research-tags = ["military"]
prerequisites = ["capital-ships", "plasma-weapons"]

[technology.titanic-hulls.ships]
fleet-size-add = 10

[technology.planetary-reconstruction]
display-name = "Planetary Reconstruction"
description = "Rebuilds even small worlds and moons into habitable ones."
research-resources = [ { resource = "resources.research", count = 6000 } ]
research-tags = ["society"]
prerequisites = ["atmospheric-engineering", "arcology-project"]
