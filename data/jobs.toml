# Jobs. Pops fill the most appealing open jobs on their planet first. Jobs whose outputs are
# scarce in the empire gain extra appeal (see `scarcity_appeal` in rules.toml), so even
# unglamorous work gets done when it matters.
#
# `upkeep` is consumed per worker per day, on top of the per-pop upkeep in the ruleset.

[import]
resources = "resources.toml"

# --- workers ---------------------------------------------------------------------------------

[job.farmer]
display_name = "Farmer"
appeal = 40

[job.technician]
display_name = "Technician"
appeal = 45

[job.miner]
display_name = "Miner"
appeal = 35

[job.clerk]
display_name = "Clerk"
description = "Keeps the paperwork flowing and the streets clean. Provides amenities."
appeal = 30

# --- specialists -----------------------------------------------------------------------------

[job.metallurgist]
display_name = "Metallurgist"
appeal = 70

[job.artisan]
display_name = "Artisan"
appeal = 60

[job.chemist]
display_name = "Chemist"
appeal = 65
upkeep = [{ resource = "resources.consumer-goods", count = 0.02 }]

[job.gas-refiner]
display_name = "Gas Refiner"
appeal = 62
upkeep = [{ resource = "resources.consumer-goods", count = 0.02 }]

[job.crystal-cutter]
display_name = "Crystal Cutter"
appeal = 66
upkeep = [{ resource = "resources.consumer-goods", count = 0.02 }]

[job.entertainer]
display_name = "Entertainer"
appeal = 65
upkeep = [{ resource = "resources.consumer-goods", count = 0.02 }]

[job.shipwright]
display_name = "Shipwright"
description = "Builds starships at a shipyard (only while ships are on order)."
appeal = 58

[job.researcher]
display_name = "Researcher"
appeal = 85
upkeep = [{ resource = "resources.consumer-goods", count = 0.05 }]

# --- rulers ----------------------------------------------------------------------------------

[job.bureaucrat]
display_name = "Bureaucrat"
description = "Runs the planetary administration from the capital complex."
appeal = 90
upkeep = [{ resource = "resources.consumer-goods", count = 0.1 }]
