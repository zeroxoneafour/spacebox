# Ship designs, weapons and outfits.
#
# A ship's build cost is its own build-cost plus those of its weapons and outfits. Normal
# resources come out of the stockpile; transient shipbuilding comes from shipyards while the
# ship is under construction.
#
# Units: distances are system units (planets sit within ~100 of their star), speeds are units
# per day, fire-rate is days between shots, shield-regen is shield points per day.
# fleet-size is how many fleet slots a ship takes (see the ruleset's base-fleet-size).
# Outfits add (hull-add, shield-add, shield-regen-add, base-speed-add) and multiply (hull-mult,
# shield-mult, shield-regen-mult, base-speed-mult, hyperjump-mult, damage-mult, range-mult,
# fire-rate-mult, which divides the delay between shots).

[import]
resources = "resources.toml"
technologies = "technologies.toml"

[ship-weapon.laser]
display-name = "Laser"
build-cost = [
    { resource = "resources.alloy", count = 10 },
]
shield-damage = 20
hull-damage = 50
fire-rate = 0.5
range = 10

[ship-weapon.mass-driver]
display-name = "Mass Driver"
description = "Kinetic slugs. Weak against shields, brutal against hulls."
build-cost = [
    { resource = "resources.alloy", count = 15 },
]
shield-damage = 10
hull-damage = 80
fire-rate = 1.0
range = 8

[ship-weapon.missile-launcher]
display-name = "Missile Launcher"
build-cost = [
    { resource = "resources.alloy", count = 25 },
]
shield-damage = 40
hull-damage = 120
fire-rate = 2.0
range = 20

[ship-weapon.plasma-cannon]
display-name = "Plasma Cannon"
build-cost = [
    { resource = "resources.alloy", count = 40 },
    { resource = "resources.volatile-motes", count = 5 },
]
shield-damage = 60
hull-damage = 200
fire-rate = 1.5
range = 12

[ship-weapon.point-defense]
display-name = "Point Defense"
build-cost = [
    { resource = "resources.alloy", count = 10 },
]
shield-damage = 15
hull-damage = 15
fire-rate = 0.25
range = 5

[ship-outfit.shield-booster]
display-name = "Shield Booster"
build-cost = [
    { resource = "resources.alloy", count = 25 },
]
shield-add = 50
shield-regen-mult = 1.5

[ship-outfit.afterburner]
display-name = "Afterburner"
build-cost = [
    { resource = "resources.alloy", count = 15 },
]
base-speed-mult = 1.3

[ship-outfit.armor-plating]
display-name = "Armor Plating"
build-cost = [
    { resource = "resources.alloy", count = 40 },
]
hull-add = 300
base-speed-mult = 0.95

[ship-outfit.deflector-array]
display-name = "Deflector Array"
build-cost = [
    { resource = "resources.alloy", count = 50 },
    { resource = "resources.exotic-gases", count = 5 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 1 },
]
shield-regen-add = 5
shield-mult = 1.4

[ship-outfit.hyperdrive-tuner]
display-name = "Hyperdrive Tuner"
build-cost = [
    { resource = "resources.alloy", count = 30 },
    { resource = "resources.exotic-gases", count = 5 },
]
hyperjump-mult = 0.6

[ship-outfit.targeting-computer]
display-name = "Targeting Computer"
build-cost = [
    { resource = "resources.alloy", count = 30 },
    { resource = "resources.rare-crystals", count = 5 },
]
fire-rate-mult = 1.25
range-mult = 1.1

[ship.scout]
display-name = "Scout"
description = "Unarmed and fast; good for keeping an eye on the neighbours."
build-cost = [
    { resource = "resources.alloy", count = 20 },
    { resource = "resources.shipbuilding", count = 40 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 0.5 },
]
hull = 150
base-speed = 18
fleet-size = 1
outfits = ["afterburner"]

[ship.corvette]
display-name = "Corvette"
build-cost = [
    { resource = "resources.alloy", count = 40 },
    { resource = "resources.shipbuilding", count = 80 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 1 },
]
hull = 400
shield = 200
base-speed = 12
shield-regen = 8
fleet-size = 1
weapons = ["laser"]
outfits = ["afterburner"]

[ship.fighter]
display-name = "Fighter"
build-cost = [
    { resource = "resources.alloy", count = 50 },
    { resource = "resources.shipbuilding", count = 100 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 1 },
]
hull = 500
shield = 350
base-speed = 10
shield-regen = 10
fleet-size = 1
weapons = ["laser", "laser"]
outfits = ["shield-booster", "afterburner"]

[ship.destroyer]
display-name = "Destroyer"
requires-tech = ["technologies.naval-doctrine"]
build-cost = [
    { resource = "resources.alloy", count = 120 },
    { resource = "resources.shipbuilding", count = 250 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 2 },
]
hull = 1200
shield = 600
base-speed = 9
shield-regen = 15
fleet-size = 2
weapons = ["mass-driver", "mass-driver", "laser"]
outfits = ["armor-plating"]

[ship.frigate]
display-name = "Plasma Frigate"
requires-tech = ["technologies.plasma-weapons", "technologies.deflector-shields"]
build-cost = [
    { resource = "resources.alloy", count = 150 },
    { resource = "resources.shipbuilding", count = 300 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 2 },
]
hull = 1000
shield = 900
base-speed = 10
shield-regen = 20
fleet-size = 2
weapons = ["plasma-cannon", "point-defense"]
outfits = ["deflector-array"]

[ship.cruiser]
display-name = "Cruiser"
requires-tech = ["technologies.capital-ships"]
build-cost = [
    { resource = "resources.alloy", count = 300 },
    { resource = "resources.shipbuilding", count = 600 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 4 },
]
hull = 3000
shield = 1500
base-speed = 7
shield-regen = 30
fleet-size = 3
weapons = ["mass-driver", "mass-driver", "missile-launcher", "missile-launcher"]
outfits = ["armor-plating", "shield-booster", "targeting-computer"]

[ship.battleship]
display-name = "Battleship"
requires-tech = ["technologies.titanic-hulls"]
build-cost = [
    { resource = "resources.alloy", count = 800 },
    { resource = "resources.shipbuilding", count = 1500 },
]
upkeep-cost = [
    { resource = "resources.energy", count = 8 },
    { resource = "resources.volatile-motes", count = 0.1 },
]
hull = 8000
shield = 4000
base-speed = 5
shield-regen = 60
hyperjump-mult = 1.5
fleet-size = 5
weapons = ["plasma-cannon", "plasma-cannon", "plasma-cannon", "missile-launcher", "missile-launcher", "point-defense"]
outfits = ["armor-plating", "armor-plating", "deflector-array", "targeting-computer", "hyperdrive-tuner"]
