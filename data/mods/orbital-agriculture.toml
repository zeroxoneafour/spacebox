# Example mod: adds an automated orbital farm for barren worlds and an upgrade for the base
# game's farms. Mods are ordinary asset files; a save opts in by importing them.

[import]
resources = "../resources.toml"
base = "../buildings.toml"
technologies = "../technologies.toml"

[building.orbital-farm]
display-name = "Orbital Farm"
description = "Spin-gravity greenhouses parked in low orbit."
# The base game's agriculture tag, so technologies boosting farms boost this too.
building-tags = ["barren", "base.agriculture"]
build-cost = [{ resource = "resources.minerals", count = 250 }, { resource = "resources.alloy", count = 40 }, { days = 120 }]
upkeep-cost = [
    { resource = "resources.energy", count = 3 },
]
outputs = [
    { resource = "resources.food", count = 6 },
]
adjacency-bonus = [
    { buildings = ["base.solar-array"], upkeep-cost-mult = 0.5 },
]

# Upgrades can target buildings from other files through an import alias.
[building-upgrade.vertical-farming]
display-name = "Vertical Farming"
buildings = ["base.farm"]
after-upgrades = ["base.irrigation-network"]
requires-tech = ["technologies.hydroponics"]
build-cost = [{ resource = "resources.minerals", count = 200 }, { days = 90 }]
output-mult = 1.2
upkeep-cost-add = [
    { resource = "resources.energy", count = 1 },
]
