# Global simulation constants. Saves pick one with `[game] ruleset = "rules.default"`.
# Every numeric field is optional and falls back to the engine default shown here.

[import]
resources = "resources.toml"
technologies = "technologies.toml"

[ruleset.default]
display-name = "Default Rules"

[ruleset.default.resources]
# What new empires start with (used by the galaxy generator and for new empires).
starting-stores = [
    { resource = "resources.food", count = 800 },
    { resource = "resources.minerals", count = 1500 },
    { resource = "resources.energy", count = 1000 },
    { resource = "resources.alloy", count = 300 },
    { resource = "resources.consumer-goods", count = 400 },
    { resource = "resources.influence", count = 200 },
]
# Maximum an empire can store.
storage-caps = [
    { resource = "resources.influence", count = 1000 },
    { resource = "resources.volatile-motes", count = 5000 },
    { resource = "resources.exotic-gases", count = 5000 },
    { resource = "resources.rare-crystals", count = 5000 },
]

# Amenities and stability (0..100, 50 is neutral).
[ruleset.default.amenities]
base-amenities = 10
amenities-per-pop = 0.1
base-stability = 50
stability-output-factor = 0.004          # output x(1 + (stability - 50) * factor)
unemployment-stability-penalty = 15      # at 100% unemployment
homelessness-stability-penalty = 20      # at 100% homelessness
comfort-stability-penalty = 20           # at a total comfort-resource shortage
crisis-stability-penalty = 25            # per unit of crisis severity, empire-wide

# Economy.
[ruleset.default.economy]
currency = "resources.energy" # settles galactic market trades
logistics-loss = 0.05         # share of surplus lost shipping out of a non-capital system
market-fee = 0.1              # galactic market buyer fee
market-reserve = 1000         # empires only sell stock above this
scarcity-appeal = 40          # max appeal bonus for jobs whose associated resource is scarce
scarcity-target-days = 60     # a resource is scarce below this many days of demand in stock

[ruleset.default.ai]
ai-interval-days = 30

[ruleset.default.technology]
research-speed-mult = 1.0 # multiplier on research speed by being applied to research income

# Expansion. Every empire receives the expansion resource each day; its cap is in
# `resources.storage-caps`. Building in an unowned system costs expansion-base-cost * 2^n
# influence and takes expansion-base-days * 2^(n/2) extra days, where n = jumps from the
# borders - 1.
[ruleset.default.expansion]
expansion-resource = "resources.influence"
expansion-resource-income = 5 # per day
expansion-base-cost = 100
expansion-base-days = 30

# Fleets.
[ruleset.default.ships]
hyperjump-days = 3            # charge time before a jump (x each ship's hyperjump-mult)
combat-subticks = 8           # combat steps per day
arrival-radius = 90           # distance from the star where fleets arrive and depart
ship-repair-rate = 0.05       # fraction of hull repaired per day in friendly, quiet systems
base-fleet-size = 20          # fleet slots per fleet before technology (ships take fleet-size slots)

# Bombardment and invasion.
[ruleset.default.invasion]
building-hp = 1000                    # damage a building absorbs (unless it sets `hp`)
building-disable-damage = 0.5         # buildings stop working past this much damage
building-repair-rate = 0.02           # damage repaired per day when not bombarded
bombardment-amenities-penalty = 40    # amenities lost while being bombarded
surrender-resistance = 4000           # x (1 + pops/500) x (0.5 + stability/100)
siege-decay = 0.02                    # siege progress lost per day without bombardment

# Diplomacy.
[ruleset.default.diplomacy]
truce-days = 360              # after peace, AI empires won't renew the war for this long

[ruleset.default.terraforming.large]
requires-tech = "technologies.atmospheric-engineering"
days = 360
cost = [
    { resource = "resources.minerals", count = 2000 },
    { resource = "resources.alloy", count = 500 },
    { resource = "resources.exotic-gases", count = 100 },
]

[ruleset.default.terraforming.small]
requires-tech = "technologies.planetary-reconstruction"
days = 540
cost = [
    { resource = "resources.minerals", count = 3000 },
    { resource = "resources.alloy", count = 1000 },
    { resource = "resources.exotic-gases", count = 200 },
    { resource = "resources.rare-crystals", count = 200 },
]
