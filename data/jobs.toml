# Jobs. Pops fill the most appealing open jobs on their planet first (appeal is 0-100). When an
# associated resource runs low in the empire, the job becomes more appealing (up to the
# ruleset's scarcity-appeal), which is how unglamorous but essential work gets done.

[import]
resources = "resources.toml"

# --- workers ---------------------------------------------------------------------------------

[job.farmer]
display-name = "Farmer"
appeal = 40
job-tags = ["worker"]
associated-resource = ["resources.food"]

[job.technician]
display-name = "Technician"
appeal = 45
job-tags = ["worker"]
associated-resource = ["resources.energy"]

[job.miner]
display-name = "Miner"
appeal = 35
job-tags = ["worker"]
associated-resource = ["resources.minerals"]

[job.clerk]
display-name = "Clerk"
description = "Keeps the paperwork flowing and the streets clean."
appeal = 30
job-tags = ["worker"]

# --- specialists -----------------------------------------------------------------------------

[job.metallurgist]
display-name = "Metallurgist"
appeal = 70
job-tags = ["specialist"]
associated-resource = ["resources.alloy"]

[job.artisan]
display-name = "Artisan"
appeal = 60
job-tags = ["specialist"]
associated-resource = ["resources.consumer-goods"]

[job.chemist]
display-name = "Chemist"
appeal = 65
job-tags = ["specialist"]
associated-resource = ["resources.volatile-motes"]

[job.gas-refiner]
display-name = "Gas Refiner"
appeal = 62
job-tags = ["specialist"]
associated-resource = ["resources.exotic-gases"]

[job.crystal-cutter]
display-name = "Crystal Cutter"
appeal = 66
job-tags = ["specialist"]
associated-resource = ["resources.rare-crystals"]

[job.entertainer]
display-name = "Entertainer"
appeal = 65
job-tags = ["specialist"]

[job.shipwright]
display-name = "Shipwright"
description = "Builds starships. Their shipbuilding is wasted if no ships are on order."
appeal = 58
job-tags = ["specialist"]

[job.researcher]
display-name = "Researcher"
appeal = 85
job-tags = ["specialist"]

# --- rulers ----------------------------------------------------------------------------------

[job.bureaucrat]
display-name = "Bureaucrat"
description = "Runs the planetary administration from the capital complex."
appeal = 90
job-tags = ["ruler"]
