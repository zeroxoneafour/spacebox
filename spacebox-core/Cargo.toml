[package]
name = "spacebox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "0.8", features = ["preserve_order"] }

[[bin]]
name = "spacebox"
path = "src/bin/spacebox.rs"

[profile.release]
debug = 1
