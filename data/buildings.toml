# Buildings, building upgrades and natural blockers.
#
# Inputs and outputs are daily at full employment and scale with workers / max-workers;
# buildings without max-workers always run at 100%. Upkeep and passive-outputs do not scale.
# Outputs may include amenities ({ amenities = N }). Build and remove costs are lists of
# resources plus { days = N }.
#
# Reserved tags: barren, blocker, water, land, space. Buildings get "land" implicitly unless
# they have "water" or "space". "barren" buildings can also go on barren planets. Blockers
# generate naturally (barren ones on barren worlds, water ones on water tiles, otherwise on
# habitable land) and are cleared by paying their remove-cost.
#
# Upgrades are [building-upgrade.*] tables applying to `buildings` and/or `building-tags`.
# They add (`x-add`) and then multiply (`x-mult`) upkeep-cost, inputs, outputs,
# passive-outputs, max-workers and housing. Adjacency bonuses name their neighbours the same
# way. Tags belong to this file; other files refer to them as `alias.tag`.

[import]
resources = "resources.toml"
jobs = "jobs.toml"
technologies = "technologies.toml"

[building.capital-complex]
display-name = "Capital Complex"
description = "Seat of planetary government. Self-sufficient enough to bootstrap a colony."
max-workers = 50
job = "jobs.bureaucrat"
building-tags = ["capital", "administration"]
housing = 300
build-cost = [{ resource = "resources.minerals", count = 2000 }, { resource = "resources.alloy", count = 500 }, { days = 720 }]
max-per-planet = 1
hp = 4000
outputs = [
    { resource = "resources.energy", count = 20 },
    { resource = "resources.minerals", count = 10 },
    { resource = "resources.food", count = 10 },
    { resource = "resources.research", count = 5 },
    { amenities = 50 },
]

