# Resources. All amounts in the game are daily unless noted otherwise.
#
# Normal resources stockpile in empire storage. Transient resources (research, shipbuilding) are
# produced at all times but never stored: whatever active projects don't consume is wasted.
#
# Fields: display-name, description, transient (default false), tradeable (default true),
# base-value (galactic market reference price in the ruleset currency, default 1).
# Storage caps are set per ruleset (`[ruleset.x.resources] storage-caps`).

# --- basic resources -------------------------------------------------------------------------

[resource.energy]
display-name = "Energy"
description = "Power for every building in the empire. Also the currency of the galactic market."

[resource.minerals]
display-name = "Minerals"
description = "Raw ores and regolith. The foundation of all construction."

[resource.food]
display-name = "Food"
description = "Keeps organic pops alive. Running out causes famine."

# --- advanced resources ----------------------------------------------------------------------

[resource.alloy]
display-name = "Alloy"
description = "Advanced metal alloy"
base-value = 4.0

[resource.consumer-goods]
display-name = "Consumer Goods"
description = "Everyday comforts. Shortages make pops unhappy."
base-value = 2.0

# --- strategic resources ---------------------------------------------------------------------

[resource.volatile-motes]
display-name = "Volatile Motes"
description = "Unstable particles used in high-energy metallurgy."
base-value = 10.0

[resource.exotic-gases]
display-name = "Exotic Gases"
description = "Rare atmospheric compounds harvested from gas giant moons."
base-value = 10.0

[resource.rare-crystals]
display-name = "Rare Crystals"
description = "Lattice crystals prized in nanofabrication and luxury architecture."
base-value = 10.0

# --- empire resources ------------------------------------------------------------------------

[resource.influence]
display-name = "Influence"
description = "Political capital, gained every day and spent to claim new systems."
tradeable = false
base-value = 5.0

# --- transient resources ---------------------------------------------------------------------

[resource.research]
display-name = "Research"
description = "Scientific progress. Wasted unless technologies are being researched."
transient = true
tradeable = false

[resource.shipbuilding]
display-name = "Shipbuilding"
description = "Shipyard labour. Wasted unless ships are being built."
transient = true
tradeable = false
